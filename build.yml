name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: yes | sdkmanager --licenses > /dev/null || true

      - name: Unzip and locate project
        run: |
          # Берём любой zip в корне репозитория (самый свежий) — имя архива не важно.
          ZIP=$(ls -t ./*.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "В корне репозитория нет .zip с проектом"; exit 1; fi
          echo "Архив: $ZIP"
          unzip -l "$ZIP" | head -30
          rm -rf project && mkdir -p project
          unzip -q "$ZIP" -d project
          # Корень проекта = каталог с самым неглубоким settings.gradle(.kts)
          SETTINGS=$(find project -name 'settings.gradle*' | awk '{print gsub("/","/"), $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle not found in archive"; exit 1; fi
          ROOT=$(dirname "$SETTINGS")
          echo "Project root: $ROOT"
          ls -la "$ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Gradle memory settings
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> "$PROJECT_DIR/gradle.properties"

      - name: Pin work-runtime-ktx
        run: |
          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            sed -i 's/work-runtime-ktx:2.9.3/work-runtime-ktx:2.9.1/' "$PROJECT_DIR/app/build.gradle.kts"
          fi

      - name: Build
        run: cd "$PROJECT_DIR" && gradle assembleRelease --no-daemon

      # Release-сборка без своего signingConfig даёт app-release-unsigned.apk — такой APK не ставится на телефон.
      # Подписываем его. Если в Secrets есть KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS — используется ваш ключ
      # (обновления ставятся поверх друг друга); иначе создаётся одноразовый ключ (перед установкой новой сборки старую удалите).
      - name: Sign release APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK=$(find "$PROJECT_DIR" -path '*build/outputs/apk/release/*.apk' | head -n1)
          if [ -z "$APK" ]; then echo "Release APK не найден:"; find "$PROJECT_DIR" -path '*build/outputs/*' -name '*.apk'; exit 1; fi
          echo "Найден: $APK"
          mkdir -p out
          if [[ "$APK" == *unsigned* ]]; then
            if [ -n "$KS_B64" ]; then
              echo "$KS_B64" | base64 -d > ci.jks
              PASS="$KS_PASS"; ALIAS="$KS_ALIAS"
            else
              PASS=android; ALIAS=ci
              keytool -genkeypair -keystore ci.jks -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI Build"
            fi
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
            echo "apksigner: $BT"
            "$BT/apksigner" sign --ks ci.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out out/app-release.apk "$APK"
            "$BT/apksigner" verify --print-certs out/app-release.apk | head -3
          else
            cp "$APK" out/app-release.apk
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: out/app-release.apk
          if-no-files-found: error

name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: yes | sdkmanager --licenses > /dev/null || true

      - name: Unzip and locate project
        run: |
          unzip -l TodoQuest.zip | head -30
          mkdir -p project
          unzip -q TodoQuest.zip -d project
          SETTINGS=$(find project -name 'settings.gradle*' | head -n1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle not found in archive"; exit 1; fi
          ROOT=$(dirname "$SETTINGS")
          echo "Project root: $ROOT"
          ls -la "$ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Gradle memory settings
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> "$PROJECT_DIR/gradle.properties"

      - name: Pin work-runtime-ktx
        run: sed -i 's/work-runtime-ktx:2.9.3/work-runtime-ktx:2.9.1/' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build
        run: cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TodoQuest-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

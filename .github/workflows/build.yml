name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: unzip -q TodoQuest.zip
      - run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> TodoQuest/gradle.properties
      - run: sed -i 's/work-runtime-ktx:2.9.3/work-runtime-ktx:2.9.1/' TodoQuest/app/build.gradle.kts
      - run: cd TodoQuest && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TodoQuest-apk
          path: TodoQuest/app/build/outputs/apk/release/app-release.apk
